# wapiti / trailcam nginx site — project-plan §9 (default.wapiti.cam).
# Baked into trailcam-server:v1 by builder/Dockerfile.server; pulled forward
# from WI-103 to unblock the WI-101 HTTP test gate (test-plan §1: the primary
# suite runs against https://172.17.0.1:4444, and AUTH-18 requires Secure
# session cookies — plain HTTP cannot carry them).
#
# SVC-02: `nginx -t` on this file must report "syntax is ok".
# Dev host port is 4444 (the 4430–4443 block is taken — project-plan §3.1).
server {
    listen 443 ssl;
    server_name default.wapiti.cam localhost;

    ssl_certificate     /etc/wapiti/server.crt;
    ssl_certificate_key /etc/wapiti/server.key;

    root /var/www/html/public;
    index index.php;

    # §9 — 4K photos + video bursts
    client_max_body_size 25M;

    # PWA static first; everything else (/api/, /auth/, /device/, /admin/api/,
    # /mcp — SSE-capable via the fastcgi timeout below) falls through to Laravel.
    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ [.]php$ {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_read_timeout 60s;   # headroom for SSE endpoints (§11)
    }

    # Block dotfiles (.env, .git, …). storage/ and vendor/ live outside
    # public/ anyway, so they are unreachable by construction (§15).
    location ~ /[.](?!well-known).* { deny all; }
}
